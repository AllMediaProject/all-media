<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Media AUD-008 Fix</title>
<style>
:root{--bg:#101a3a;--card:#182447;--peach:#ffc384;--text:#f8f8f2;--muted:#aeb7cb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{width:min(760px,100%);margin:auto;padding:24px;border:1px solid rgba(255,195,132,.35);border-radius:18px;background:var(--card)}
h1{margin:0 0 8px}
p{line-height:1.55;color:var(--muted)}
.notice{margin:18px 0;padding:15px;border:1px solid rgba(255,195,132,.22);border-radius:12px;background:rgba(0,0,0,.14)}
button{width:100%;padding:14px;border:0;border-radius:11px;background:var(--peach);color:var(--bg);font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.55}
#status{margin-top:16px;white-space:pre-wrap;font:12px/1.6 monospace;color:var(--muted)}
code{color:var(--peach)}
</style>
</head>
<body>
<main>
<h1>AUD-008 · New Pockets start empty</h1>
<p>This creates a corrected replacement from the current live <code>pocket-page-prototype.html</code>.</p>

<div class="notice">
<strong>Important:</strong><br>
Do <em>not</em> upload this RUN-ME file to GitHub.<br><br>
Click the button. It will download a different file named:<br>
<code>pocket-page-prototype-AUD-008-FIXED.txt</code>
</div>

<button id="go">Build corrected Pocket page</button>
<div id="status">Ready.</div>
</main>

<script>
(() => {
  const RAW =
    "https://raw.githubusercontent.com/AllMediaProject/all-media/main/pocket-page-prototype.html";

  const OLD = `  if(!data)return;

  $("#pocketName").textContent=data.name||"Untitled Pocket";`;

  const NEW = `  if(!data)return;

  /* AUD-008: a newly created Pocket must begin with no saved posts.
     Only run this on the initial creation visit; edits and normal opens
     must preserve the Pocket's existing contents. */
  if(params.get("new")==="1"){
    try{
      const pocketName=String(data.name||"").trim().toLowerCase();
      if(pocketName){
        const saved=JSON.parse(localStorage.getItem("allMediaPocketSavedPostsV1")||"{}");
        saved[pocketName]=[];
        localStorage.setItem("allMediaPocketSavedPostsV1",JSON.stringify(saved));
      }
    }catch(e){}
  }

  $("#pocketName").textContent=data.name||"Untitled Pocket";`;

  const status = document.getElementById("status");
  const button = document.getElementById("go");

  button.onclick = async () => {
    button.disabled = true;
    status.textContent = "Fetching the current Pocket page from GitHub…";

    try{
      const res = await fetch(RAW + "?aud008=" + Date.now(), {cache:"no-store"});
      if(!res.ok) throw new Error("GitHub returned HTTP " + res.status);

      let source = await res.text();

      if(!source.includes("<!DOCTYPE html>") && !source.includes("<!doctype html>")){
        throw new Error("Safety check failed: fetched file is not HTML.");
      }

      if(source.includes("/* AUD-008: a newly created Pocket must begin with no saved posts.")){
        status.textContent += "\n✓ AUD-008 patch is already present.";
      }else{
        if(!source.includes(OLD)){
          throw new Error("Safety check failed: expected Pocket creation code was not found. No file was created.");
        }
        source = source.replace(OLD, NEW);
        status.textContent += "\n✓ Added AUD-008 empty-Pocket initialization.";
      }

      const blob = new Blob([source], {type:"text/plain;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pocket-page-prototype-AUD-008-FIXED.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);

      status.textContent +=
        "\n✓ DONE\n\n" +
        "NEXT:\n" +
        "1. Rename pocket-page-prototype-AUD-008-FIXED.txt to pocket-page-prototype.html\n" +
        "2. Upload THAT renamed file to the repo root\n" +
        "3. Replace the current pocket-page-prototype.html\n" +
        "4. Commit: Fix AUD-008 new Pocket empty state";
    }catch(err){
      console.error(err);
      status.textContent =
        "ERROR: " + err.message +
        "\n\nNothing was changed on GitHub.";
    }finally{
      button.disabled = false;
    }
  };
})();
</script>
</body>
</html>
